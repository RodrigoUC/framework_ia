[theme]
base = "light"
primaryColor = "#1a3c2b"
font = "sans serif"
baseRadius = "small"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
backgroundColor = "#f7f7f5"
secondaryBackgroundColor = "#eeeee9"
textColor = "#242523"
borderColor = "#a8aaa2"
chartCategoricalColors = ["#1a3c2b", "#b84c35", "#806000", "#2d7456", "#77512f", "#65416f"]
redColor = "#b42318"
orangeColor = "#a9471e"
yellowColor = "#715600"
blueColor = "#1a5f8f"
greenColor = "#1f6b4f"
violetColor = "#65416f"
grayColor = "#535750"

[theme.dark]
backgroundColor = "#111713"
secondaryBackgroundColor = "#1a241d"
textColor = "#f7f7f5"
borderColor = "#556158"
primaryColor = "#9effbf"
chartCategoricalColors = ["#9effbf", "#ff9a7f", "#ffd166", "#7ddcaa", "#f3bf8c", "#d8b4fe"]
redColor = "#ffb4ab"
orangeColor = "#ffb68c"
yellowColor = "#ffe08a"
blueColor = "#9ed0ff"
greenColor = "#8cf0c0"
violetColor = "#d8b4fe"
grayColor = "#c5c9c3"

[theme.light.sidebar]
backgroundColor = "#1a3c2b"
secondaryBackgroundColor = "#264a37"

[theme.dark.sidebar]
backgroundColor = "#0e2016"
secondaryBackgroundColor = "#193324"
