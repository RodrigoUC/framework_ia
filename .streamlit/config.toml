# Tema Atlas Analítico. Archivo reconstruido para la entrega Lab02:
# conserva la paleta de la interfaz y los contrastes verificados por las pruebas.
[theme]
primaryColor = "#1a3c2b"
font = "sans-serif"

[theme.light]
backgroundColor = "#f7f7f5"
secondaryBackgroundColor = "#eeeee9"
textColor = "#242523"

[theme.light.sidebar]
primaryColor = "#1a3c2b"
backgroundColor = "#eeeee9"
textColor = "#242523"

[theme.dark]
primaryColor = "#2e7d4f"
backgroundColor = "#111713"
secondaryBackgroundColor = "#1a241d"
textColor = "#f7f7f5"

[theme.dark.sidebar]
primaryColor = "#2e7d4f"
backgroundColor = "#1a241d"
textColor = "#f7f7f5"
