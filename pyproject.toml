[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framework-ia"
version = "0.1.0"
description = "Modular framework for exploratory analysis and machine learning (Nexo AI / AI Framework)"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["framework_ia*", "ai_framework*", "scripts*"]
