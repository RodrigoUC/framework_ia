name: Lab 02 verification

on:
  pull_request:
    branches: [lab_2, 'lab2/**']
  push:
    branches: [lab_2, 'lab2/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run framework and Lab 02 tests
        run: python -m pytest -q
      - name: Check reproducible entry points
        run: |
          python -m scripts.ejecutar_lab01 --help
          python -m scripts.ejecutar_lab02 --help
