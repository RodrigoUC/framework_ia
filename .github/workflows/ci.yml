name: Framework and supervised verification

on:
  pull_request:
    branches: [lab_2, 'lab2/**', lab_03]
  push:
    branches: [lab_2, 'lab2/**', lab_03]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run framework tests
        run: python -m pytest -q
      - name: Check reproducible entry points
        run: |
          python -m scripts.ejecutar_no_supervisado --help
          python -m scripts.ejecutar_clasificacion --help
          python -m scripts.ejecutar_regresion --help
          python -m scripts.ejecutar_agentes --help
          python -m scripts.preparar_diabetes --help
          python -m scripts.preparar_potabilidad --help
          python -m scripts.preparar_concrete --help
          python -m scripts.generar_informe --help
          python -m scripts.preparar_entrega --help
      - name: Reproduce the offline regression reference
        run: |
          python -m scripts.preparar_diabetes --salida "$RUNNER_TEMP/regression-data"
          python -m scripts.preparar_diabetes --salida "$RUNNER_TEMP/regression-data"
          python -m scripts.ejecutar_regresion "$RUNNER_TEMP/regression-data/diabetes_regresion.csv" --target target --feature-simple bmi --salida "$RUNNER_TEMP/regression-results"
